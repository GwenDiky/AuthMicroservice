[tool.poetry]
name = "auth"
version = "0.1.0"
description = ""
authors = ["Tamagil <tamagiltamagil@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
pyjwt = "^2.9.0"
fastapi = "^0.115.0"
uvicorn = "^0.31.0"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
pydantic = {extras = ["email"], version = "^2.9.2"}
pydantic-extra-types = "^2.9.0"
alembic = "^1.13.3"
phonenumbers = "^8.13.46"
pytest = "^8.3.3"
python-dotenv = "^1.0.1"
bcrypt = "^4.2.0"
python-multipart = "^0.0.12"
asyncpg = "^0.29.0"
psycopg2 = "^2.9.9"
fastapi-jwt = "^0.3.0"
authlib = "^1.3.2"
pydantic-settings = "^2.5.2"
fastapi-oauth2 = "^1.3.0"
redis = "^5.1.1"
aioredis = "^2.0.1"

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "auth",
]
testpaths = [
  "tests",
]
