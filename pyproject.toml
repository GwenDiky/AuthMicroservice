[tool.poetry]
name = "auth"
version = "0.1.0"
description = ""
authors = ["Tamagil <tamagiltamagil@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
pyjwt = "^2.9.0"
fastapi = "^0.115.0"
uvicorn = "^0.31.0"
sqlalchemy = "2.0.30"
pydantic = {extras = ["email"], version = "^2.9.2"}
pydantic-extra-types = "^2.9.0"
alembic = "^1.13.3"
phonenumbers = "^8.13.46"
pytest = "^8.3.3"


[tool.poetry.group.dev.dependencies]
httpx = "^0.27.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "auth",
]
testpaths = [
  "tests",
]
